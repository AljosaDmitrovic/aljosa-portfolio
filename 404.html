<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Aljoša Dmitrović</title>
  <meta name="robots" content="noindex">
  <script>
    (function () {
      var seg = location.pathname.split("/")[1];
      var base = /\.github\.io$/.test(location.hostname) && seg ? "/" + seg + "/" : "/";
      document.write('<base href="' + base + '">');
    })();
  </script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>
    try {
      var s = localStorage.getItem("theme");
      document.documentElement.dataset.theme = (s ? s === "dark" : matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <style>
    .nf { min-height: 100svh; display: grid; place-items: center; text-align: center; }
    .nf-code { font-size: clamp(5rem, 18vw, 9rem); font-weight: 700; color: var(--primary); line-height: 1; letter-spacing: -0.05em; }
    .nf p { margin-block: var(--space-4) var(--space-6); color: var(--muted); }
  </style>
</head>
<body>
  <main class="nf container">
    <div>
      <p class="eyebrow"><span class="mono">// 404: route not found</span></p>
      <h1 class="nf-code">404</h1>
      <p>This endpoint doesn't exist. Let's get you back home.</p>
      <a class="btn btn-primary" href="./">Back to homepage</a>
    </div>
  </main>
</body>
</html>
